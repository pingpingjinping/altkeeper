name: PR 35 ARM64 test image

on:
  push:
    branches: [ci/pr35-arm64-test-image]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 1aade2b80391f6b1afebe0d01fdac2679951b8ff
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: false
          load: true
          tags: altkeeper:pr35-arm64
          labels: org.opencontainers.image.revision=1aade2b80391f6b1afebe0d01fdac2679951b8ff
          cache-from: type=gha,scope=altkeeper-pr-linux/arm64
      - name: Verify and encrypt the test image
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' altkeeper:pr35-arm64)" = linux/arm64
          docker run --rm -e ALTKEEPER_LANG=en altkeeper:pr35-arm64 --help | grep '^usage: altkeeper'
          cat > "$RUNNER_TEMP/pr35-recipient.crt" <<'PEM'
          -----BEGIN CERTIFICATE-----
          MIIENzCCAp+gAwIBAgIUC96/yLfhuBcaK51XXXguf4Oxg2kwDQYJKoZIhvcNAQEL
