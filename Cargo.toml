[package]
default-run = "altkeeper"
name = "altkeeper"
version = "0.2.0"
edition = "2021"
description = "AltServer for iOS 17+ that runs on your home server (Docker): renews and installs sideloaded iPhone apps over Wi-Fi, no computer or VPN"
license = "MIT"
readme = "README.md"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json", "multipart", "ws"] }
idevice = { version = "0.1.68", default-features = false, features = [
  "ring",
  "remote_pairing",
  "rsd",
  "tcp",
  "tunnel_tcp_stack",
  "core_device_proxy",
  "misagent",
  "installation_proxy",
  "afc",
  "usbmuxd",
] }
isideload = { version = "0.4.6", default-features = false, features = [
  "install",
  "fs-storage",
  "tokio-mt",
] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
mdns-sd = "0.21.4"
plist = "1"
rpassword = "7"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tempfile = "3.27"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

base64 = "0.21"
hex = "0.4"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls-no-provider"] }
omnisette = { path = "vendor/omnisette", default-features = false, features = ["async", "remote-anisette"] }
sha2 = "0.10"
uuid = "1"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

# La copia in vendor/ è isideload 0.4.6 (upstream 8ca39b62) con due modifiche locali:
# gli accessor di AnisetteData usati dal ponte AltStore e il logging ALTKEEPER_DEBUG /
# le impostazioni di trasporto HTTP/1.1 portate dalla vecchia copia 0.3.17.
[patch.crates-io]
isideload = { path = "vendor/isideload" }

[profile.release]
opt-level = "s"
lto = true
strip = true


# Upstream v0.5.6 pins this loader fix to avoid xmas-elf 0.9 (RUSTSEC-2025-0018).
[patch."https://github.com/Dadoum/android-loader"]
android-loader = { git = "https://github.com/BartolomeoRusso9/android-loader", rev = "96ed02b2aee91d7854dcb4b75a17e4288f40ab94" }
